[package]
name = "ref_compare"
version = "0.1.0"
edition = "2021"

# Эталон для сверки: открытый солвер postflop-solver (AGPL-3.0). Используется только этим
# инструментом сравнения и не входит в приложение.
[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
